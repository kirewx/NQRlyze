[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nqrlyze"
version = "0.1.0"
description = "Autofitter for exact quadrupolar NMR/NQR powder lineshapes, cross-validated against QUEST"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.scripts]
nqrlyze = "nqrlyze.cli:main"

[tool.setuptools.packages.find]
include = ["nqrlyze*"]

[tool.setuptools.package-data]
nqrlyze = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
